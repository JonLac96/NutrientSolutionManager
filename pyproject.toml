[project]
name = "nutrient-solution-manager"
version = "0.1.0"
description = "Regelt Nährlösung in Tanks über Messwerte, Zielbereiche und eine Jobliste."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "fastapi",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
src = ["app", "tests", "tools"]

# Schichtverbote stehen in den ruff.toml von app/calculations, app/services und app/models.
[tool.ruff.lint]
select = ["E", "F", "I", "DTZ", "TID251"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["app"]
